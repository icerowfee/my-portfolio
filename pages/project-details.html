                lightbox.classList.add("hidden");
                document.body.classList.remove("lightbox-open");
                lightboxImage.src = "";
            };
            const openLightbox = (trigger) => {
                lightboxImage.src = trigger.dataset.imageSrc;
                lightboxImage.alt = trigger.dataset.imageAlt;
                lightboxCaption.textContent = trigger.dataset.imageAlt;
                lightbox.classList.remove("hidden");
                document.body.classList.add("lightbox-open");
                document.getElementById("lightbox-close").focus();
            };

            document.querySelectorAll(".gallery-trigger").forEach((trigger) => {
                trigger.addEventListener("click", () => openLightbox(trigger));
            });
            document.getElementById("lightbox-close").addEventListener("click", closeLightbox);

                if (event.target.id === "lightbox-backdrop") closeLightbox();
            });
            document.addEventListener("keydown", (event) => {
                if ((event.key === "Escape" || event.key === "Esc") && !lightbox.classList.contains("hidden")) {
